plugins {
    id 'java-gradle-plugin'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.1.1' apply false
}

group = 'net.uebliche'
version = System.getenv('MCMETA_PLUGIN_VERSION') ?: '0.1.0'

def externalBuildDir = providers.gradleProperty('mcmeta_plugin_build_dir')
        .map { it.trim() }
        .orNull
if (externalBuildDir) {
    layout.buildDirectory.set(file(externalBuildDir))
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
}

gradlePlugin {
    plugins {
        create('mcmeta') {
            id = 'net.uebliche.mcmeta'
            implementationClass = 'net.uebliche.mcmeta.McmetaPlugin'
            displayName = 'mcmeta version helper'
            description = 'Loads mcmeta versions into Gradle properties.'
        }
    }
}

def usePrecompiledPlugin = providers.gradleProperty('mcmeta_plugin_precompiled')
        .map { it.toBoolean() }
        .orElse(false)
if (usePrecompiledPlugin.get()) {
    def precompiledJar = tasks.named('jar').flatMap { it.archiveFile }
    gradle.projectsEvaluated {
        if (!precompiledJar.get().asFile.isFile()) {
            throw new GradleException("Precompiled mcmeta plugin is missing: ${precompiledJar.get().asFile}")
        }
    }
    tasks.configureEach { task ->
        if (task.name in ['compileKotlin', 'compileJava', 'pluginDescriptors', 'processResources', 'jar']) {
            task.enabled = false
        }
    }
}

def publishEnabled = providers.gradleProperty('mcmetaPublish').present ||
        System.getenv('MCMETA_PUBLISH') == '1'

if (publishEnabled) {
    apply plugin: 'com.gradle.plugin-publish'
    pluginBundle {
        website = 'https://github.com/uebliche/mcmeta'
        vcsUrl = 'https://github.com/uebliche/mcmeta'
        tags = ['minecraft', 'modding', 'versions', 'metadata']
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/uebliche/mcmeta')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: ''
                password = System.getenv('GITHUB_TOKEN') ?: ''
            }
        }
    }
}
